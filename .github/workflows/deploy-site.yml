name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one but never cancels a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-site.txt

      # web/public/data is not committed; it is rebuilt from the parquet files and models in the repo. The export
      # only changes when its inputs do, so a push that leaves them alone reuses the last export.
      - id: site-data
        uses: actions/cache@v4
        with:
          path: web/public/data
          key: site-data-${{ hashFiles('data/**', 'models/**', 'src/**/*.py', 'scripts/export_site_data.py', 'requirements-site.txt') }}

      - if: steps.site-data.outputs.cache-hit != 'true'
        run: pip install -r requirements-site.txt
      - if: steps.site-data.outputs.cache-hit != 'true'
        run: python scripts/export_site_data.py

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
